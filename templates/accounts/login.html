{% extends 'base.html' %}

{% block title %}登录 - 智境·AI{% endblock %}

{% block content %}
<div class="page-header">
    <div class="container">
        <h1><i class="bi bi-box-arrow-in-right"></i> 登录</h1>
        <p>登录你的智境账户，开启AI创作之旅</p>
    </div>
</div>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="ai-card">
                <form method="post">
                    {% csrf_token %}
                    {% if form.errors %}
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i> 用户名或密码错误，请重试。
                    </div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">用户名</label>
                        <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">密码</label>
                        <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-ai w-100 py-2">
                        <i class="bi bi-box-arrow-in-right"></i> 登录
                    </button>
                </form>
                <div class="text-center mt-3">
                    <span class="text-muted">还没有账户？</span>
                    <a href="{% url 'accounts:register' %}" class="text-decoration-none" style="color: var(--primary);">立即注册</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
