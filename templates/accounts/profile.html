{% extends 'base.html' %}

{% block title %}个人中心 - 智境·AI{% endblock %}

{% block content %}
<div class="page-header">
    <div class="container">
        <h1><i class="bi bi-person-circle"></i> 个人中心</h1>
        <p>管理你的个人资料</p>
    </div>
</div>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="ai-card text-center mb-4">
                <img src="{% if user.profile.avatar %}{{ user.profile.avatar.url }}{% else %}https://via.placeholder.com/100{% endif %}" alt="头像" class="avatar-img mb-3">
                <h4 class="fw-bold">{{ user.username }}</h4>
                <p class="text-muted">{{ user.email }}</p>
                <p class="small text-muted">注册时间：{{ user.date_joined|date:"Y-m-d" }}</p>
            </div>
            <div class="ai-card">
                <h2><i class="bi bi-pencil-square"></i> 编辑资料</h2>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">头像</label>
                        {{ form.avatar }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">个人简介</label>
                        {{ form.bio }}
                    </div>
                    <button type="submit" class="btn btn-ai">
                        <i class="bi bi-check-lg"></i> 保存修改
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
